name: identidade-local

services:
  api:
    build:
      context: ../api
    ports:
      - "8000:8000"
    env_file:
      - path: ../api/.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/identidade_local.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ../api/app:/app/app
      - api_data:/data

  client:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules

volumes:
  api_data:
  client_node_modules:
